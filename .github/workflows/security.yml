---
name: security

# Re-scans what changes without a commit: advisories against unchanged locks, findings in
# the pulled and built images, and the analysis query suite
# (docs/adr/0048, docs/adr/0050, docs/adr/0051). checks.yml re-runs the hook stages; this
# workflow adds the daily schedule, manual dispatch, the image scan, which needs Docker and
# image pulls, and CodeQL. Every action is pinned to a commit, no checkout persists its
# token, and dynamic values appear only in `env:`.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    paths:
      - "deploy/**"
      - "uv.lock"
      - "agent-mesh/uv.lock"
      - "pyproject.toml"
      - "agent-mesh/pyproject.toml"
      - "dependency-waivers.toml"
      - "scripts/security/**"
      - "scripts/hooks/deploy/**"
      - "tools/image_inventory.py"
      - "tools/dependency_waiver_gate.py"
      - ".github/workflows/security.yml"

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scheduled-audit:
    name: dependency and configuration audit
    # The push and pull-request triggers already run these hooks through checks.yml; the
    # schedule and a manual dispatch are what add new coverage.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14.7"

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.12.5"
          enable-cache: true

      - uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.74.0

      - name: Synchronize locked Python dependencies
        run: |
          uv sync --all-packages --frozen
          uv sync --project agent-mesh --frozen --python 3.13.15

      - name: Audit both locks against the waiver registry
        run: scripts/hooks/deps/dependency-audit.sh

      - name: Audit the deploy Dockerfiles for misconfiguration
        run: scripts/hooks/deploy/trivy-config-full.sh

  image-scan:
    name: image scan
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14.7"

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.12.5"
          enable-cache: true

      - uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.74.0
          cache: true

      - name: Synchronize the root workspace
        run: uv sync --all-packages --frozen

      # The build needs no secret file (docs/adr/0044); it pulls the pinned bases and
      # produces the two derived images the inventory lists as built.
      - name: Build the derived images
        run: >-
          docker compose --env-file .env.example -f deploy/compose.yaml
          --profile mesh --profile services build agent-mesh dashboard-api

      - name: Scan every pulled and built image
        run: scripts/security/scan-images.sh

      # An advisory inside a pinned image is reported, not enforced; the blocking control is
      # that the pin is still the newest digest its tag carries (docs/adr/0055).
      - name: Refuse an image pin upstream has moved past
        run: scripts/security/check-image-pins.sh

  codeql:
    name: CodeQL (python)
    # Not on pull requests: a Dependabot pull request carries a read-only token and cannot
    # upload results, and an actor guard is itself a workflow-audit finding (docs/adr/0050).
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: github/codeql-action/init@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4
        with:
          languages: python
          build-mode: none

      - uses: github/codeql-action/analyze@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4
        with:
          category: "/language:python"
