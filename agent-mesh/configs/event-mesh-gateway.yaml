# The official Event Mesh Gateway 1.1.0, carrying one salient drone event from the application
# data plane into the mesh as one structured A2A task. This is the ingress half of the Phase 0
# Event Mesh spike; the Event Mesh Tool egress half is a separate configuration.
#
# It runs on its own `event-mesh-gateway` identity rather than the runtime's, on both the control
# plane and the data plane, because that role may subscribe to the drone-event family and publish
# the agent-response family and nothing else (docs/adr/0061). The broker enforces that
# independently of everything below.
#
# The data-plane queue is temporary and the gateway names it itself; neither is configurable, so
# a salient event published while this app is down reaches no queue. That is accepted and scoped
# in docs/adr/0071, and it is why the application topic, not this gateway, is the authoritative
# record of a salient event.
apps:
  - name: event-mesh-gateway-app
    app_module: aerial_rescue_event_mesh_gateway.app
    broker:
      dev_mode: false
      broker_url: ${SOLACE_BROKER_URL}
      broker_username: ${SOLACE_EVENT_MESH_GATEWAY_USERNAME}
      broker_password: ${SOLACE_EVENT_MESH_GATEWAY_PASSWORD}
      broker_vpn: ${SOLACE_BROKER_VPN}
      temporary_queue: true
    app_config:
      namespace: ${NAMESPACE}
      gateway_id: aerial-rescue-event-mesh-gateway
      authorization_service: {type: none}
      default_user_identity: aerial-rescue-fleet
      # The same filesystem path all four other apps share. A structured invocation hands its
      # input to the agent as an artifact reference, and a memory artifact service is per-app
      # even inside one connector process, so the agent would fail to load it.
      artifact_service: {type: filesystem, base_path: /tmp/aerial-rescue-artifacts}
      # No card. tests/phase0/test_agent_mesh_live.py holds the mesh to exactly three agent
      # cards, and this is a gateway rather than an agent: it is reached over a topic, not asked.
      gateway_card_publishing: {enabled: false}
      # Deferred rejection, at the gateway and in every handler, is fixed by docs/CONTRACTS.md
      # and refused as GATEWAY_POLICY by the configuration validator on anything else. The
      # timeout is derived in docs/operating-parameters.md, not measured.
      acknowledgment_policy:
        mode: on_completion
        on_failure:
          action: nack
          nack_outcome: rejected
        timeout_seconds: 180
      event_mesh_broker_config:
        dev_mode: false
        broker_url: ${SOLACE_BROKER_URL}
        broker_username: ${SOLACE_EVENT_MESH_GATEWAY_USERNAME}
        broker_password: ${SOLACE_EVENT_MESH_GATEWAY_PASSWORD}
        broker_vpn: ${SOLACE_BROKER_VPN}
        temporary_queue: true
      event_handlers:
        - name: salient-drone-event
          # One family, one event type. `*` is the Solace single-level wildcard, and the literal
          # last level keeps routine telemetry and every other drone event out of a model, which
          # docs/ARCHITECTURE.md requires. The role's ACL grants no more than this either.
          subscriptions:
            - topic: aerial-rescue/v1/*/drone/*/event/salient
              qos: 1
          payload_encoding: utf-8
          payload_format: json
          # Read per handler, not from the app-level default above: the gateway's claim
          # extraction consults the handler's own expression and then the handler's own
          # default, and discards the message when neither yields an identity. A drone is not
          # an operator, so there is no per-event identity to extract and the default is the
          # whole of it. The operator identity that matters is the one the approval endpoint
          # derives from its bearer, and nothing here can supply it (docs/adr/0024).
          default_user_identity: aerial-rescue-fleet
          # The validated CloudEvent's payload, passed as an object rather than spliced into a
          # template. `detail` is free text a drone reported, so it is untrusted input; keeping
          # it a JSON string value means it cannot break out of the structure around it.
          input_expression: input.payload:data
          # Declaring both schemas uses the official plugin's structured invocation protocol:
          # the accepted data object becomes an artifact and the response is read only from the
          # schema-validated output artifact. The agent owns only two bounded coordinates. Every
          # identity and source binding is added later by the owned gateway component from trusted
          # forward context; the model cannot select or override one.
          structured_invocation:
            input_schema:
              type: object
              required:
                - missionId
                - droneId
                - observation
                - latitudeMicrodegrees
                - longitudeMicrodegrees
                - detail
              additionalProperties: false
              properties:
                missionId:
                  type: string
                  pattern: '^(?:[a-z0-9]|[a-z0-9][a-z0-9-]{0,62}[a-z0-9])$'
                droneId:
                  type: string
                  pattern: '^(?:[a-z0-9]|[a-z0-9][a-z0-9-]{0,62}[a-z0-9])$'
                observation:
                  type: string
                  pattern: '^[a-z][a-z0-9]*(?:-[a-z0-9]+)*$'
                  maxLength: 32
                latitudeMicrodegrees:
                  type: integer
                  minimum: -90000000
                  maximum: 90000000
                longitudeMicrodegrees:
                  type: integer
                  minimum: -180000000
                  maximum: 180000000
                detail:
                  type: string
                  maxLength: 4096
            output_schema:
              type: object
              required:
                - latitudeMicrodegrees
                - longitudeMicrodegrees
              additionalProperties: false
              properties:
                latitudeMicrodegrees:
                  type: integer
                  minimum: -90000000
                  maximum: 90000000
                longitudeMicrodegrees:
                  type: integer
                  minimum: -180000000
                  maximum: 180000000
          target_agent_name: MissionCoordinator
          on_success: salient-event-assessment
          on_error: salient-event-failure
          forward_context:
            # aerial-rescue/v1/{missionId}/drone/{droneId}/event/salient -- level 2.
            missionId: input.topic_levels:2
            droneId: input.topic_levels:4
            # The complete CloudEvent remains outside the model-owned output. These members let
            # the owned boundary compare topic and envelope identities before it constructs a
            # candidate. A mismatch produces only a redacted abstention.
            eventMissionId: input.payload:data.missionId
            eventDroneId: input.payload:data.droneId
            sourceEventId: input.payload:id
            sourceEventDigest: input.user_properties:aerial-rescue-source-event-digest
            correlationId: input.payload:correlationid
            agentName: static:MissionCoordinator
      # Both routes publish the same closed integration document inside the agent-response
      # family, the only application family this role may publish. The official output handler
      # evaluates the owned `agent_response` field and validates it once more before Direct I/O.
      # A model never supplies a topic, command event, application identity, or source binding.
      output_handlers:
        - name: salient-event-assessment
          topic_expression: 'template:aerial-rescue/v1/{{text://user_data.forward_context:missionId}}/agent/response/MissionCoordinator'
          payload_expression: task_response:agent_response
          payload_encoding: utf-8
          payload_format: json
          output_schema: &agent_response_schema
            anyOf:
              - type: object
                required:
                  - agentResponseVersion
                  - missionId
                  - agentName
                  - invocationId
                  - correlationId
                  - outcome
                  - result
                additionalProperties: false
                properties:
                  agentResponseVersion: {const: 1}
                  missionId:
                    type: string
                    pattern: '^(?:[a-z0-9]|[a-z0-9][a-z0-9-]{0,62}[a-z0-9])$'
                  agentName:
                    type: string
                    pattern: '^[A-Za-z0-9_]{1,64}$'
                  invocationId:
                    type: string
                    pattern: '^(?:[a-z0-9]|[a-z0-9][a-z0-9-]{0,62}[a-z0-9])$'
                  correlationId:
                    type: string
                    pattern: '^(?:[a-z0-9]|[a-z0-9][a-z0-9-]{0,62}[a-z0-9])$'
                  outcome: {const: candidate}
                  result:
                    type: object
                    required:
                      - proposalType
                      - sourceEventId
                      - sourceEventDigest
                      - droneId
                      - latitudeMicrodegrees
                      - longitudeMicrodegrees
                      - commandType
                    additionalProperties: false
                    properties:
                      proposalType: {const: candidate-location}
                      sourceEventId:
                        type: string
                        pattern: '^(?:[a-z0-9]|[a-z0-9][a-z0-9-]{0,62}[a-z0-9])$'
                      sourceEventDigest:
                        type: string
                        pattern: '^[0-9a-f]{64}$'
                      droneId:
                        type: string
                        pattern: '^(?:[a-z0-9]|[a-z0-9][a-z0-9-]{0,62}[a-z0-9])$'
                      latitudeMicrodegrees:
                        type: integer
                        minimum: -90000000
                        maximum: 90000000
                      longitudeMicrodegrees:
                        type: integer
                        minimum: -180000000
                        maximum: 180000000
                      commandType: {const: escalate-rescue}
              - type: object
                required:
                  - agentResponseVersion
                  - missionId
                  - agentName
                  - invocationId
                  - correlationId
                  - outcome
                  - reason
                additionalProperties: false
                properties:
                  agentResponseVersion: {const: 1}
                  missionId:
                    type: string
                    pattern: '^(?:[a-z0-9]|[a-z0-9][a-z0-9-]{0,62}[a-z0-9])$'
                  agentName:
                    type: string
                    pattern: '^[A-Za-z0-9_]{1,64}$'
                  invocationId:
                    type: string
                    pattern: '^(?:[a-z0-9]|[a-z0-9][a-z0-9-]{0,62}[a-z0-9])$'
                  correlationId:
                    type: string
                    pattern: '^(?:[a-z0-9]|[a-z0-9][a-z0-9-]{0,62}[a-z0-9])$'
                  outcome: {const: abstained}
                  reason:
                    enum:
                      - timeout
                      - transport-error
                      - model-error
                      - invalid-output
                      - identity-mismatch
          on_validation_error: drop
        - name: salient-event-failure
          topic_expression: 'template:aerial-rescue/v1/{{text://user_data.forward_context:missionId}}/agent/response/MissionCoordinator'
          payload_expression: task_response:agent_response
          payload_encoding: utf-8
          payload_format: json
          output_schema: *agent_response_schema
          on_validation_error: drop
