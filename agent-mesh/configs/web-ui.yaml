# The HTTP/SSE Web UI, the engineering surface on which agent-card discovery and delegation
# are inspected (docs/adr/0065).
#
# `fastapi_host` is 0.0.0.0 because it binds inside the container; loopback is enforced by the
# published port `127.0.0.1:8000` in deploy/compose.yaml, which the compose policy gate holds.
# That binding is also the compensating control the accepted google-adk advisory rests on
# (TECH_DEBT.md section 1), so `cors_allowed_origins` is stated explicitly rather than left to
# the upstream default of ["*"].
#
# There is no `web-ui` broker principal: all four apps run in one connector process, so this
# one uses the same agent-mesh-agent identity (docs/adr/0061).
apps:
  - name: web-ui-app
    app_module: solace_agent_mesh.gateway.http_sse.app
    broker:
      dev_mode: false
      broker_url: ${SOLACE_BROKER_URL}
      broker_username: ${SOLACE_AGENT_MESH_AGENT_USERNAME}
      broker_password: ${SOLACE_AGENT_MESH_AGENT_PASSWORD}
      broker_vpn: ${SOLACE_BROKER_VPN}
      temporary_queue: true
    app_config:
      # Terminated deliberately: two upstream topic families concatenate this value with no
      # separator, so an unterminated namespace lands them outside the granted namespace, and
      # every normalising helper strips the separator before adding its own (docs/adr/0221).
      namespace: ${NAMESPACE}/
      gateway_id: aerial-rescue-web-ui
      session_secret_key: ${SESSION_SECRET_KEY}
      # Filesystem rather than memory, and one path for all four apps. A memory artifact
      # service is per-app even inside one connector process, so a workflow node that hands
      # its input to a peer agent by artifact reference fails with "Artifact ... not found".
      # Proven live on 2026-08-21; see release-evidence/phase-0/mesh-first-run.md.
      artifact_service: {type: filesystem, base_path: /tmp/aerial-rescue-artifacts}
      # Where the browser fetches the model registry. The gateway publishes this to the page as
      # `frontend_platform_server_url` and the frontend concatenates it verbatim onto
      # `/api/v1/platform/...`, so it carries no trailing slash and no path. It is dereferenced by
      # the browser rather than by this container, so it names the published loopback port rather
      # than a container-internal host, even though both apps share one process. Left unset the
      # fetch silently becomes a same-origin request the gateway mounts no router for
      # (docs/adr/0222).
      platform_service:
        url: ${PLATFORM_SERVICE_URL}
      fastapi_host: 0.0.0.0
      fastapi_port: 8000
      cors_allowed_origins:
        - http://127.0.0.1:8000
        - http://localhost:8000
