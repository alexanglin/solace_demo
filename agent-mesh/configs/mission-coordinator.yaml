# The one specialised agent the Orchestrator delegates to, so that Phase 0 can prove a real
# A2A delegation rather than a single agent talking to itself.
#
# It is a delegation target only: `allow_list` is empty and `deny_list` is `*`, so it can be
# asked but cannot ask. Deny-by-default is the same posture the broker's authorization matrix
# takes (docs/adr/0061), expressed here at the A2A layer.
apps:
  - name: mission-coordinator-app
    app_module: solace_agent_mesh.agent.sac.app
    broker:
      dev_mode: false
      broker_url: ${SOLACE_BROKER_URL}
      broker_username: ${SOLACE_AGENT_MESH_AGENT_USERNAME}
      broker_password: ${SOLACE_AGENT_MESH_AGENT_PASSWORD}
      broker_vpn: ${SOLACE_BROKER_VPN}
      temporary_queue: true
    app_config:
      namespace: ${NAMESPACE}
      agent_name: MissionCoordinator
      display_name: Mission Coordinator
      model:
        model: ollama_chat/llama3:8b
        api_base: ${OLLAMA_HOST}
      # The structured answer is two integers, so the agent needs no artifact tools; without this
      # the framework injects eight of them and instructs the model to use them, which is what
      # sent qwen3:4b into a twenty-call loop past the gateway's acknowledgment window. The bound
      # below keeps a model that still does not converge inside that window
      # (docs/adr/0198-give-the-coordinator-a-model-and-a-tool-surface-that-answer.md).
      auto_inject_artifact_tools: false
      max_llm_calls_per_task: 4
      instruction: |
        You assess observations reported by search aircraft in a wilderness
        search-and-rescue exercise.

        When a request carries a structured output schema, answer with exactly one JSON
        object satisfying it and nothing else: no prose, no explanation, no artifact, and
        no tool call. A salient observation asks for the candidate location to search
        next, as the two integer members `latitudeMicrodegrees` and `longitudeMicrodegrees`.

        Those two integers are the observation's own `latitudeMicrodegrees` and
        `longitudeMicrodegrees`, copied exactly, unless its `detail` gives you a specific
        reason to move the search elsewhere; if it does, move them by the smallest amount
        that reason justifies. Never invent a location, never round, and never answer with
        coordinates you were not given.

        When a request carries no output schema, answer in prose: describe how you would
        divide the search area into sectors and which to search first, with your reasoning.
        Use ask_command_gateway to find out whether a command type may be published, and
        say what it answered. Its answer is authoritative and yours is not: the command
        gateway decides, and asking it never causes anything to happen.

        You may only propose. You cannot assign a sector, dispatch a drone, or escalate a
        rescue. Represent the subject anonymously and never infer identity.
      # The egress half of the Phase 0 Event Mesh spike: one tool request producing one
      # validated, non-actuating command-gateway response (docs/IMPLEMENTATION_PLAN.md).
      #
      # It runs on its own `event-mesh-tool` identity, which may publish the gateway-request
      # family and consume only the reserved reply channel (docs/adr/0061, docs/adr/0070).
      # Nothing here is the safety boundary: ADR-0005 rejected enforcement in this
      # configuration, because the model can override any parameter it can see. The command
      # gateway's deny-by-default tables are what refuse an operation or a command type.
      tools:
        - tool_type: python
          component_module: sam_event_mesh_tool.tools
          class_name: EventMeshTool
          tool_config:
            tool_name: ask_command_gateway
            description: >-
              Ask the deterministic command gateway which authority a command type falls
              under. Read-only: it records nothing and publishes no command.
            topic: aerial-rescue/v1/{{ missionId }}/gateway/request/{{ operation }}
            wait_for_response: true
            parameters:
              - name: missionId
                type: string
                required: true
                description: The mission the question is about.
                payload_path: missionId
              - name: operation
                type: string
                required: true
                description: Always command-authority; no other operation exists.
                default: command-authority
                payload_path: operation
              - name: commandType
                type: string
                required: true
                description: The command type to ask about, such as escalate-rescue.
                payload_path: commandType
              - name: rpcVersion
                type: integer
                required: false
                default: 1
                description: The contract version; leave it alone.
                payload_path: rpcVersion
            event_mesh_config:
              payload_encoding: utf-8
              payload_format: json
              # Solace AI Connector fixes the reply topic once per session and appends a
              # UUID, so the mission level cannot carry a mission. `reply` is reserved for
              # it and no event may claim it (docs/adr/0070). The validator refuses any
              # other prefix as TOOL_REPLY.
              response_topic_prefix: aerial-rescue/v1/reply/gateway/response
              # Two 60 s agent requests can run in series before this tool is reached, and
              # the command gateway's own answer involves no model at all.
              request_expiry_ms: 30000
              broker_config:
                dev_mode: false
                broker_url: ${SOLACE_BROKER_URL}
                broker_username: ${SOLACE_EVENT_MESH_TOOL_USERNAME}
                broker_password: ${SOLACE_EVENT_MESH_TOOL_PASSWORD}
                broker_vpn: ${SOLACE_BROKER_VPN}
                temporary_queue: true
      session_service: {type: memory}
      # Filesystem rather than memory, and one path for all four apps. A memory artifact
      # service is per-app even inside one connector process, so a workflow node that hands
      # its input to a peer agent by artifact reference fails with "Artifact ... not found".
      # Proven live on 2026-08-21; see release-evidence/phase-0/mesh-first-run.md.
      artifact_service: {type: filesystem, base_path: /tmp/aerial-rescue-artifacts}
      agent_card:
        description: Assesses and prioritises search sectors for a wilderness search area.
        defaultInputModes: [text]
        defaultOutputModes: [text]
        skills:
          - id: assess_sectors
            name: Assess search sectors
            description: Divide a search area into sectors and rank them by search priority.
            tags: [search, sectors]
      agent_card_publishing: {interval_seconds: 30}
      agent_discovery: {enabled: true}
      inter_agent_communication:
        allow_list: []
        deny_list: ['*']
        request_timeout_seconds: 60
