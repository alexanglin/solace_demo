# Local model lock (docs/adr/0063-lock-local-models-by-manifest-digest.md).
#
# Ollama is addressable only as `name:tag`, and a tag is mutable: `ollama pull` re-points it
# with no warning. The digest therefore cannot live in the model identifier a configuration
# carries, so it lives here. The offline configuration validator proves that a local model is
# listed here in the canonical form and that its digest is well formed; readiness compares
# these digests against `GET /api/tags` on the running daemon.
#
# `digest` is the Ollama *manifest* digest, the value `GET /api/tags` reports as
# `.models[].digest` and whose first twelve characters are the identifier `ollama list` prints.
format = 1

[[models]]
identifier = "ollama_chat/llama3.1:8b"
digest = "sha256:46e0c10c039e019119339687c3c1757cc81b9da49709a3b3924863ba87ca666e"
recorded_on = "2026-08-31"
recorded_by = "Alex Anglin"
reason = "Every agent carries a tool -- _notify_artifact_save loads unconditionally -- so a completion-only model cannot serve one. llama3:8b reports ['completion'] alone and was refused for that reason; llama3.1:8b is the same family and size and reports ['completion', 'tools'] from GET /api/show, which ADR-0200 requires. It replaces mistral:7b, on which the MissionResponse workflow completed about once in twelve attempts."
