[project]
name = "aerial-rescue-evidence-service"
version = "0.0.0"
description = "Model-observation validation, provenance, and domain-score coordination."
requires-python = ">=3.14,<3.15"
dependencies = [
    "aerial-rescue-broker",
    "aerial-rescue-contracts",
    "aerial-rescue-domain",
    "aerial-rescue-store",
    "pydantic==2.13.4",
]

[project.scripts]
aerial-rescue-evidence-service = "aerial_rescue_evidence_service.console:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aerial_rescue_evidence_service"]

[tool.aerial-rescue]
# Risk tier per docs/adr/0017-mutation-tool-score-and-risk-tiers.md. A member with no
# declared tier fails the gate rather than defaulting to the weakest one.
risk-tier = 2
