[project]
name = "aerial-rescue-recorder"
version = "0.0.0"
description = "Sanitized recording and side-effect-free replay."
requires-python = ">=3.14,<3.15"
dependencies = [
    "aerial-rescue-broker",
    "aerial-rescue-contracts",
    "aerial-rescue-observability",
    "aerial-rescue-store",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aerial_rescue_recorder"]

[tool.aerial-rescue]
# Risk tier per docs/adr/0017-mutation-tool-score-and-risk-tiers.md. A member with no
# declared tier fails the gate rather than defaulting to the weakest one.
risk-tier = 2
