[project]
name = "aerial-rescue-command-gateway"
version = "0.0.0"
description = "Deterministic command gateway: policy, approval consumption, dispatch."
requires-python = ">=3.14,<3.15"
# The typed Solace façade, wire contracts, pure state tables, durable records, and
# Pydantic trust boundary. The untyped client itself is reached only through
# aerial-rescue-broker (docs/adr/0028).
dependencies = [
    "aerial-rescue-broker",
    "aerial-rescue-contracts",
    "aerial-rescue-domain",
    "aerial-rescue-store",
    "pydantic==2.13.4",
]

# The process entry point. There is no __main__.py: a two-line module has no function
# body, and the mutation gate fails a tier-one module it cannot score (ADR-0017).
[project.scripts]
aerial-rescue-command-gateway = "aerial_rescue_command_gateway.console:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aerial_rescue_command_gateway"]

[tool.aerial-rescue]
# Risk tier per docs/adr/0017-mutation-tool-score-and-risk-tiers.md. A member with no
# declared tier fails the gate rather than defaulting to the weakest one.
risk-tier = 1

[tool.mutmut]
source_paths = ["src"]
pytest_add_cli_args_test_selection = ["tests"]
on_dependency_change = "rerun"
cache_invalidation_files = [
    "tests/**/*.py",
    "pyproject.toml",
    "../../pyproject.toml",
    "../../uv.lock",
    "../../packages/*/pyproject.toml",
    "../../packages/*/src/**/*.py",
    "../../services/*/pyproject.toml",
    "../../services/*/src/**/*.py",
]
