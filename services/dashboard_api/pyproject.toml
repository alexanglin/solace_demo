[project]
name = "aerial-rescue-dashboard-api"
version = "0.0.0"
description = "FastAPI scenario control, replay, health, readiness, and SSE."
requires-python = ">=3.14,<3.15"
dependencies = [
    "aerial-rescue-broker",
    "aerial-rescue-contracts",
    "aerial-rescue-domain",
    "aerial-rescue-observability",
    "aerial-rescue-store",
    "fastapi==0.141.1",
    "httpx==0.28.1",
    "pydantic==2.13.4",
    "uvicorn==0.52.3",
]

[project.scripts]
aerial-rescue-dashboard-api = "aerial_rescue_dashboard_api.delivery.production:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aerial_rescue_dashboard_api"]

[tool.aerial-rescue]
# Risk tier per docs/adr/0017-mutation-tool-score-and-risk-tiers.md. A member with no
# declared tier fails the gate rather than defaulting to the weakest one.
risk-tier = 2
