[project]
name = "aerial-rescue-fleet-simulator"
version = "0.0.0"
description = "Deterministic fleet physics and adapters around domain state machines."
requires-python = ">=3.14,<3.15"
# The typed Solace facade, wire contracts, deny-by-default machines, and durable
# records. Vendor transport and SQL implementations remain behind their packages.
dependencies = [
    "aerial-rescue-broker",
    "aerial-rescue-contracts",
    "aerial-rescue-domain",
    "aerial-rescue-store",
    "fastapi==0.141.1",
    "pydantic==2.13.4",
    "uvicorn==0.52.3",
]

[project.scripts]
aerial-rescue-fleet-simulator = "aerial_rescue_fleet_simulator.console:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aerial_rescue_fleet_simulator"]

[tool.aerial-rescue]
# Risk tier per docs/adr/0017-mutation-tool-score-and-risk-tiers.md. A member with no
# declared tier fails the gate rather than defaulting to the weakest one.
risk-tier = 2
