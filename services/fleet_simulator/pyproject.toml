[project]
name = "aerial-rescue-fleet-simulator"
version = "0.0.0"
description = "Deterministic fleet physics and adapters around domain state machines."
requires-python = ">=3.14,<3.15"
# The typed Solace facade, the wire contracts, and the deny-by-default machines. The
# untyped client itself is reached only through aerial-rescue-broker (docs/adr/0028).
# The production module entry point receives validated scenarios only through the
# scenario service's authenticated private-control hop.
dependencies = [
    "aerial-rescue-broker",
    "aerial-rescue-contracts",
    "aerial-rescue-domain",
    "fastapi==0.141.1",
    "pydantic==2.13.4",
    "uvicorn==0.52.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aerial_rescue_fleet_simulator"]

[tool.aerial-rescue]
# Risk tier per docs/adr/0017-mutation-tool-score-and-risk-tiers.md. A member with no
# declared tier fails the gate rather than defaulting to the weakest one.
risk-tier = 2
