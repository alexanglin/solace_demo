[project]
name = "aerial-rescue-fleet-simulator"
version = "0.0.0"
description = "Deterministic fleet physics and adapters around domain state machines."
requires-python = ">=3.14,<3.15"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aerial_rescue_fleet_simulator"]

[tool.aerial-rescue]
# Risk tier per docs/adr/0017-mutation-tool-score-and-risk-tiers.md. A member with no
# declared tier fails the gate rather than defaulting to the weakest one.
risk-tier = 2
