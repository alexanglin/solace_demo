[project]
name = "aerial-rescue-store"
version = "0.0.0"
description = "Durable mission store, migrations, and repository adapters."
requires-python = ">=3.14,<3.15"
# The structured refusal base every module here raises, so the command gateway can audit
# a denied durable attempt through the same handler as a denied domain rule.
dependencies = ["aerial-rescue-domain"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aerial_rescue_store"]

[tool.aerial-rescue]
# Risk tier per docs/adr/0017-mutation-tool-score-and-risk-tiers.md. A member with no
# declared tier fails the gate rather than defaulting to the weakest one.
risk-tier = 2
