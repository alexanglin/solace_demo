[project]
name = "aerial-rescue-observability"
version = "0.0.0"
description = "Structured logging, metrics, and trace-context propagation."
requires-python = ">=3.14,<3.15"
dependencies = ["aerial-rescue-contracts", "opentelemetry-api==1.42.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aerial_rescue_observability"]

[tool.aerial-rescue]
# Risk tier per docs/adr/0017-mutation-tool-score-and-risk-tiers.md. A member with no
# declared tier fails the gate rather than defaulting to the weakest one.
risk-tier = 2
