[project]
name = "aerial-rescue-domain"
version = "0.0.0"
description = "Pure typed domain rules, state machines, and the spend guardrail."
requires-python = ">=3.14,<3.15"
dependencies = ["aerial-rescue-contracts"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aerial_rescue_domain"]

[tool.aerial-rescue]
# Risk tier per docs/adr/0017-mutation-tool-score-and-risk-tiers.md. A member with no
# declared tier fails the gate rather than defaulting to the weakest one.
risk-tier = 1

[tool.mutmut]
source_paths = ["src"]
pytest_add_cli_args_test_selection = ["tests"]
on_dependency_change = "rerun"
cache_invalidation_files = [
    "tests/**/*.py",
    "pyproject.toml",
    "../../pyproject.toml",
    "../../uv.lock",
    "../../packages/*/pyproject.toml",
    "../../packages/*/src/**/*.py",
    "../../services/*/pyproject.toml",
    "../../services/*/src/**/*.py",
]

# Mechanical layering enforcement, per docs/adr/0011:18: packages/domain cannot import
# Solace, FastAPI, SQLAlchemy, asyncpg, or Ollama clients. This converts the "pure typed
# domain functions" rule from an aspiration into a build failure. Scoped here rather than
# at the root because packages/store and packages/broker legitimately need these. The
# roots named here equal FORBIDDEN_IMPORT_ROOTS in tools/import_contract_gate.py, and
# tools/quality_gate_tests/contracts/test_import_contract_gate.py holds the two lists equal.
[tool.ruff]
extend = "../../pyproject.toml"

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"solace".msg = "packages/domain must stay transport-free (ADR-0011); use a port."
"solace.messaging".msg = "packages/domain must stay transport-free (ADR-0011); use a port."
"fastapi".msg = "packages/domain must stay framework-free (ADR-0011)."
"sqlalchemy".msg = "packages/domain must stay persistence-free (ADR-0011); use a port."
"asyncpg".msg = "packages/domain must stay persistence-free (ADR-0011); use a port."
"ollama".msg = "packages/domain must stay model-client-free (ADR-0011); use a port."
"litellm".msg = "packages/domain must stay model-client-free (ADR-0011); use a port."
"solace_agent_mesh".msg = "packages/domain must not import the Agent Mesh runtime (ADR-0011); use a port."
"httpx".msg = "packages/domain must not perform I/O (ADR-0011); use a port."
