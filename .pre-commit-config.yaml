# Aerial Rescue Mesh -- git hook configuration
#
# See docs/adr/0012-git-hooks-with-ci-as-authority.md for the decision and
# CONTRIBUTING.md for how to install and run these.
#
# Design notes that are easy to get wrong:
#
#  * Hooks are CHECK-ONLY. Nothing here rewrites a staged file, so the commit
#    contains exactly what you reviewed. `just fix` applies fixes on request.
#    This is why the mutating `trailing-whitespace` / `end-of-file-fixer` hooks
#    are absent: ruff-format, prettier, markdownlint (MD009/MD047) and yamllint
#    detect the same problems without modifying anything.
#
#  * A hook whose files/types match nothing is SKIPPED ENTIRELY. Language hooks
#    activate when their owned files land; project-owned always-run gates enforce
#    the fail-closed component rules recorded in ADR-0019.
#
#  * `pass_filenames: false` does NOT imply always-run. pre-commit computes the
#    file list and decides to skip BEFORE consulting pass_filenames, so a hook
#    that must run regardless needs BOTH `always_run: true` and
#    `pass_filenames: false`.
#
#  * Python is checked by TWO environments (docs/adr/0004-split-python-runtimes.md):
#    the root uv workspace on 3.14.x and the separate agent-mesh project on
#    3.13.x. Hooks are routed by path with files:/exclude:.
#
# Revision policy: every rev is an exact upstream tag. Renovate's `pre-commit`
# manager raises one reviewable PR per hook; it is disabled by default and must
# be enabled explicitly.

minimum_pre_commit_version: "4.5.0"

default_install_hook_types:
  - pre-commit
  - commit-msg
  - pre-push
  - post-checkout
  - post-merge
  - pre-merge-commit

# A push must be at least as strict as the commit it publishes, so every hook runs at
# both blocking stages unless it says otherwise (docs/adr/0104). Naming the two
# explicitly is still load-bearing: an unset default_stages would also wire every hook
# into commit-msg, post-checkout, post-merge, and pre-merge-commit.
default_stages: [pre-commit, pre-push]

fail_fast: false

repos:
  # ---------------------------------------------------------------- hygiene --
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-merge-conflict
      # macOS is case-insensitive, Linux CI is not. This catches the collision
      # before it becomes an unreproducible CI failure.
      - id: check-case-conflict
      - id: check-illegal-windows-names
      # CLAUDE.md is a symlink to AGENTS.md. These two keep it intact.
      - id: check-symlinks
      - id: destroyed-symlinks
      - id: check-yaml
        args: [--allow-multiple-documents]
        exclude: ^agent-mesh/configs/.*\.ya?ml$
      - id: check-toml
      - id: check-json
      - id: check-xml
      - id: check-added-large-files
        args: [--maxkb=2048]
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable
      - id: check-vcs-permalinks
      - id: detect-private-key
      # detect-aws-credentials is deliberately NOT enabled: it reads the
      # developer's real ~/.aws/credentials and greps files for those values,
      # which both false-positives on common words and pulls a live credential
      # store into the commit path. gitleaks covers this properly.
      # docs/adr/0001 forbids vendoring Agent Mesh as a submodule.
      - id: forbid-submodules
      # AGENTS.md §9 (Version control): work in a branch. Commit stage only -- at
      # pre-push this would refuse every push made from main, which is the branch this
      # repository publishes (docs/adr/0104).
      - id: no-commit-to-branch
        args: [--branch, main]
        stages: [pre-commit]
      - id: check-ast
      - id: debug-statements

  # ---------------------------------------------------------------- secrets --
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      # The stock hook hardcodes `--staged --pre-commit`, so it scans the staged
      # diff only. Full-history scanning is a separate local hook at pre-push, and
      # this one stays off that stage rather than passing over an empty staged diff
      # and reporting a verdict it never reached (docs/adr/0104).
      - id: gitleaks
        stages: [pre-commit]

  # ----------------------------------------------------------------- python --
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.3
    hooks:
      # `ruff-check`, not the legacy `ruff` alias. No --fix: check-only.
      # Carries the C901 and PLR09xx complexity gates from docs/adr/0011.
      - id: ruff-check
      - id: ruff-format
        args: [--check]

  # ------------------------------------------------------------ yaml / toml --
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint
        args: [--strict, -c, .yamllint.yaml]

  # ------------------------------------------------------------------- docs --
  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.23.2
    hooks:
      - id: markdownlint-cli2
        # Pin Node 24 LTS for this hook (ADR-0103). pre-commit provisions it
        # via nodeenv, so the hook is reproducible regardless of system Node --
        # and it must be pinned: markdownlint's dependency tree rejects the
        # Node 25 "Current" line outright.
        language_version: "24.19.0"

  - repo: https://github.com/crate-ci/typos
    rev: v1.49.0
    hooks:
      - id: typos
        # Default args include --write-changes. Override for check-only.
        args: [--force-exclude]

  # --------------------------------------------------------- ci / container --
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint

  # Workflow security audit: persisted checkout credentials, expression injection, permission
  # breadth, dangerous triggers. Offline so a token in a contributor's environment cannot make
  # the local verdict differ from continuous integration's; any finding fails, and a
  # suppression needs a record (docs/adr/0049-audit-workflows-with-zizmor-at-the-commit-stage.md).
  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: v1.29.0
    hooks:
      - id: zizmor
        args: [--offline]

  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: 0.38.0 # upstream tags have no "v" prefix
    hooks:
      - id: check-github-workflows
      - id: check-github-workflows-require-timeout
      - id: check-dependabot
      - id: check-compose-spec
      - id: check-metaschema
        files: ^schemas/.*\.schema\.json$

  # hadolint-py runs hadolint as a Python package -- no Docker in the commit path.
  - repo: https://github.com/AleksaC/hadolint-py
    rev: v2.15.1
    hooks:
      - id: hadolint

  # ------------------------------------------------------------------ shell --
  - repo: https://github.com/scop/pre-commit-shfmt
    rev: v3.13.1-1
    hooks:
      - id: shfmt
        args: [--diff] # check-only; default is --write

  # ------------------------------------------------- project-owned checks ----
  - repo: local
    hooks:
      # shellcheck via the system binary rather than the upstream hook, which is
      # language: docker_image and would put Docker in the commit path.
      - id: shellcheck
        name: shellcheck
        entry: shellcheck
        args: [-x]
        language: system
        types: [shell]
        require_serial: true

      # Every executable project-owned test must have one explicit, ordered,
      # non-empty Arrange/Act/Assert cycle. This syntax-aware gate scans the
      # whole tracked tree so moving or renaming a test cannot bypass it. Its
      # conformance suite runs first and the gate fails closed if it breaks.
      - id: test-aaa
        name: tests use Arrange-Act-Assert
        entry: python -m tools.aaa_checker.gate
        language: python
        language_version: python3.14
        additional_dependencies:
          - pytest==9.1.1
          - tree-sitter==0.26.0
          - tree-sitter-typescript==0.23.2
        stages: [pre-commit, pre-push]
        always_run: true
        pass_filenames: false
        require_serial: true

      - id: no-env-files
        name: block .env files
        entry: scripts/hooks/repo/check-no-env.sh
        language: script
        # Must see every staged path, so it cannot be scoped by type.
        always_run: true

      - id: env-template-placeholders
        name: environment templates contain placeholders only
        entry: scripts/hooks/check-env-template.sh
        language: script
        files: (^|/)\.env\.example$

      - id: import-contracts
        name: domain import contracts
        entry: python -m tools.import_contract_gate
        language: python
        language_version: python3.14
        stages: [pre-commit, pre-push]
        always_run: true
        pass_filenames: false

      - id: contract-artifacts
        name: schemas and golden fixtures have one validated owner
        entry: python -m tools.contract_gate
        language: python
        language_version: python3.14
        additional_dependencies:
          - jsonschema==4.26.0
          - referencing==0.37.0
        stages: [pre-commit, pre-push]
        always_run: true
        pass_filenames: false

      # Repository-scoped, so unlike the component gates it has no inert state: every
      # repository has directories (docs/adr/0033-bound-directory-fan-out.md). The
      # enumeration is in the script because ADR-0025 confines subprocess to four
      # reviewed Python owners.
      - id: directory-fanout
        name: directories are decomposed rather than flat
        entry: scripts/hooks/repo/directory-fanout.sh
        language: script
        stages: [pre-commit, pre-push]
        always_run: true
        pass_filenames: false

      # Inert until the first file lands under agent-mesh/configs/, then fails closed on a
      # missing lock, interpreter, or validator (docs/adr/0032-agent-mesh-semantic-configuration-validator.md).
      - id: agent-mesh-configs
        name: Agent Mesh configuration semantics
        entry: scripts/hooks/agent-mesh/check-agent-mesh-configs.sh
        language: script
        stages: [pre-commit, pre-push]
        always_run: true
        pass_filenames: false

      # Inert until deploy/ holds a compose file or Dockerfile, then fails closed on a
      # missing .env.example, pyproject.toml, uv.lock, uv, or gate module
      # (docs/adr/0045-fail-closed-compose-policy-gate.md). The gate parses files, so
      # Docker never enters the commit path; the enumeration is in the script because
      # ADR-0025 confines subprocess to four reviewed Python owners.
      - id: compose-policy
        name: deploy stack satisfies the compose policy
        entry: scripts/hooks/deploy/check-compose-policy.sh
        language: script
        stages: [pre-commit, pre-push]
        always_run: true
        pass_filenames: false

      # Inert until apps/dashboard holds a manifest or TypeScript source, then fails
      # closed. Holds the compiler options, the required package scripts, the zero-warning
      # rule, the coverage thresholds, and the exact-version rule to docs/adr/0057.
      - id: typescript-policy
        name: dashboard TypeScript configuration policy
        entry: scripts/hooks/dashboard/check-typescript-policy.sh
        language: script
        stages: [pre-commit, pre-push]
        always_run: true
        pass_filenames: false

      # Generated dashboard types are committed review artifacts. Re-run the
      # check-only offline generator whenever an input or generated output changes.
      - id: dashboard-contracts-current
        name: generated dashboard contracts are current
        entry: scripts/hooks/dashboard/dashboard-contracts-check.sh
        language: script
        files: ^(schemas/contract-manifest\.toml|schemas/v1/canonical\.schema\.json|schemas/v1/dashboard/.*\.schema\.json|fixtures/golden/v1/dashboard/.*\.json|apps/dashboard/(scripts/generate-dashboard-contracts\.ts|src/contracts/generated/.*\.ts|package\.json|pnpm-lock\.yaml))$
        stages: [pre-commit, pre-push]
        pass_filenames: false
        require_serial: true

      - id: docs-facts-and-links
        name: docs (facts, links, ADR index)
        entry: scripts/hooks/docs/check-docs.sh
        language: script
        types: [markdown]

      - id: diagrams-fresh
        name: diagrams regenerated
        entry: scripts/hooks/docs/check-diagrams.sh
        language: script
        files: ^docs/architecture/.*(\.dot|\.png|\.dot\.sha256)$

      - id: uv-lock-root
        name: uv.lock current (root, py3.14)
        entry: uv lock --check
        language: system
        files: ^(pyproject\.toml|uv\.lock)$
        pass_filenames: false

      - id: uv-lock-agent-mesh
        name: uv.lock current (agent-mesh, py3.13)
        entry: uv lock --check --project agent-mesh
        language: system
        files: ^agent-mesh/(pyproject\.toml|uv\.lock)$
        pass_filenames: false

      # mypy runs through uv so it sees real project dependencies. The
      # pre-commit/mirrors-mypy hook cannot: it builds an isolated env and bakes
      # --ignore-missing-imports into its defaults, silently degrading every
      # third-party import to Any. Whole-program checking runs at pre-push;
      # these are the fast staged-file passes.
      - id: mypy-root
        name: mypy (root, py3.14)
        entry: uv run --frozen mypy
        language: system
        types_or: [python, pyi]
        exclude: ^agent-mesh/
        require_serial: true

      - id: mypy-agent-mesh
        name: mypy (agent-mesh, py3.13)
        # Runs from agent-mesh/ over the whole tree rather than from the root over the
        # staged files. mypy resolves a module name relative to its working directory, so
        # from the root `from tools import agent_mesh_config_validator` collides with the
        # root tooling package and resolves only when the validator happens to be staged
        # beside its own tests. Whole-tree also removes the fast/authoritative disagreement
        # ADR-0029 exists to prevent, and costs 0.29s warm
        # (docs/adr/0062-type-check-the-agent-mesh-domain-from-its-own-directory.md).
        entry: scripts/hooks/agent-mesh/mypy-agent-mesh.sh
        language: script
        types_or: [python, pyi]
        files: ^agent-mesh/
        pass_filenames: false
        require_serial: true

      - id: eslint
        name: eslint (dashboard)
        entry: pre-commit hazmat cd apps/dashboard pnpm exec eslint --
        language: system
        files: ^apps/dashboard/.*\.(ts|tsx|js|jsx|cjs|mjs)$
        require_serial: true

      # Whole-project by nature, so `files:` is a TRIGGER rather than a scope. It must
      # include the configuration and the manifests, because a tsconfig edit or an @types
      # bump changes the verdict for every file while touching no .ts at all. The
      # unconditional run is dashboard-typecheck-full at pre-push (docs/adr/0057).
      - id: tsc
        name: tsc --noEmit (dashboard)
        entry: scripts/hooks/dashboard/dashboard-typecheck-full.sh
        language: script
        files: ^apps/dashboard/(.*\.(ts|tsx)|tsconfig[^/]*\.json|package\.json|pnpm-lock\.yaml)$
        pass_filenames: false
        require_serial: true

      - id: prettier-check
        name: prettier --check (dashboard)
        entry: pre-commit hazmat cd apps/dashboard pnpm exec prettier --check --
        language: system
        files: ^apps/dashboard/.*\.(ts|tsx|js|jsx|cjs|mjs|css|json|html)$

      # Related tests only, to hold the pre-commit stage inside its budget.
      # `--run` is mandatory: vitest defaults to watch mode and would hang.
      - id: vitest-related
        name: vitest (related tests)
        entry: pre-commit hazmat cd apps/dashboard pnpm exec vitest related --run --
        language: system
        files: ^apps/dashboard/.*\.(ts|tsx)$

      # The affected unit tests ADR-0012 asks for at this stage, selected from the import
      # graph tools/affected_tests builds (docs/adr/0066). A staged Python file narrows to
      # the tests that reach it; anything else the suites read -- a hook script, a workflow,
      # a manifest, a registry -- takes the selector's `:all:` path and runs the whole
      # deterministic suite, which is what it did for every change before this.
      #
      # The trigger excludes rather than enumerates, so a file added at the top level runs
      # tests by default instead of silently skipping them. Prose documentation is out;
      # CONTRIBUTING.md and docs/operating-parameters.md stay in, because
      # test_uv_version_pin.py and test_typescript_policy_gate.py read their numbers.
      - id: pytest-unit-fast
        name: pytest (affected tests)
        entry: scripts/hooks/python/pytest-related.sh
        language: script
        exclude: ^(agent-mesh/|dist/|release-evidence/|docs/(?!operating-parameters\.md)|(AGENTS|CHANGELOG|CLAUDE|README|TECH_DEBT)\.md$|LICENSE$|NOTICE$)
        pass_filenames: true
        require_serial: true

      # The Agent Mesh domain ran no test at this stage at all before ADR-0066: the hook
      # above excludes it, and its suite ran only at pre-push. Selection uses the root
      # project's pure selector; execution stays on the 3.13 interpreter inside agent-mesh/
      # (docs/adr/0029, docs/adr/0062).
      - id: pytest-agent-mesh-fast
        name: pytest (agent-mesh, affected tests)
        entry: scripts/hooks/agent-mesh/pytest-agent-mesh-related.sh
        language: script
        files: ^agent-mesh/
        pass_filenames: true
        require_serial: true

  # -------------------------------------------------------------- commit-msg --
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: [--strict, feat, fix, docs, chore, test, refactor, perf, build, ci, revert]

  # ---------------------------------------------------------------- pre-push --
  - repo: local
    hooks:
      - id: python-quality-full
        name: Python formatting and linting (whole tree)
        entry: scripts/hooks/python/python-quality-full.sh
        language: script
        stages: [pre-push]
        always_run: true
        pass_filenames: false

      - id: cognitive-complexity-full
        name: Python cognitive complexity (whole owned tree)
        entry: scripts/hooks/python/cognitive-complexity-full.sh
        language: script
        stages: [pre-push]
        always_run: true
        pass_filenames: false

      - id: duplication-full
        name: cross-language duplication (whole owned tree)
        entry: scripts/hooks/repo/duplication-full.sh
        language: node
        # Isolated third-party hook: nodeenv provisions Node 24 LTS here (ADR-0103).
        language_version: "24.19.0"
        additional_dependencies:
          - jscpd@5.0.14
        stages: [pre-push]
        always_run: true
        pass_filenames: false

      - id: mypy-full
        name: mypy (whole project, both environments)
        entry: scripts/hooks/python/mypy-full.sh
        language: script
        stages: [pre-push]
        always_run: true
        pass_filenames: false

      - id: pytest-full
        name: pytest (full suite, per-member coverage gates)
        entry: scripts/hooks/python/pytest-full.sh
        language: script
        stages: [pre-push]
        always_run: true
        pass_filenames: false

      # Runs from inside agent-mesh/ so pytest reads that project's configuration and
      # interpreter. See docs/adr/0029-verify-the-agent-mesh-domain-with-its-own-toolchain.md
      # for why `uv run --project` is not equivalent here.
      - id: agent-mesh-test-full
        name: pytest (agent-mesh, py3.13)
        entry: scripts/hooks/agent-mesh-test-full.sh
        language: script
        stages: [pre-push]
        always_run: true
        pass_filenames: false

      - id: mutation-full
        name: mutmut (tier-one members, per-module score)
        entry: scripts/hooks/python/mutation-full.sh
        language: script
        stages: [pre-push]
        always_run: true
        pass_filenames: false

      # The stock gitleaks hook hardcodes `--staged --pre-commit`, so it can
      # only ever scan the staged diff. Full-history scanning needs its own
      # entry. language: golang (not system) so pre-commit provisions the
      # binary at the pinned version -- a security gate must never silently
      # skip because a tool is missing from PATH.
      - id: gitleaks-history
        name: gitleaks (full history)
        entry: gitleaks git --redact --verbose
        language: golang
        additional_dependencies:
          # NOT a typo: the module still declares its legacy path
          # github.com/zricethezav/gitleaks/v8, so `go install` rejects the
          # github.com/gitleaks/... form with a version-constraint conflict.
          - github.com/zricethezav/gitleaks/v8@v8.30.1
        stages: [pre-push]
        always_run: true
        pass_filenames: false

      - id: commit-range-whitespace
        name: git diff --check (whitespace, pushed range)
        entry: scripts/hooks/repo/check-commit-range.sh
        language: script
        stages: [pre-push]
        always_run: true
        pass_filenames: false

      # Finally wires scripts/hooks/deps/check-locks.sh, which existed but was referenced by
      # nothing -- so the changelog's three-domain lockfile claim was untrue.
      - id: lockfiles-current
        name: lockfiles current (root uv, agent-mesh uv, dashboard pnpm)
        entry: scripts/hooks/deps/check-locks.sh
        language: script
        stages: [pre-push]
        always_run: true
        pass_filenames: false

      - id: bandit-full
        name: bandit (static security analysis)
        entry: scripts/hooks/python/bandit-full.sh
        language: script
        stages: [pre-push]
        always_run: true
        pass_filenames: false

      - id: dependency-audit
        name: pip-audit (known advisories in the resolved environment)
        entry: scripts/hooks/deps/dependency-audit.sh
        language: script
        stages: [pre-push]
        always_run: true
        pass_filenames: false

      # Inert until deploy/ holds a compose file or Dockerfile, then fails closed on a
      # missing trivy, manifest, lock, uv, or gate module
      # (docs/adr/0048-scan-images-and-deploy-configuration-with-trivy.md). Trivy's written
      # report, not its exit status, is adjudicated by the waiver gate; verbose so the INFO
      # lines for findings below the blocking policy are shown on a pass. Image scans need
      # Docker and run only in continuous integration.
      - id: trivy-config-full
        name: trivy config (deploy/ misconfiguration audit)
        entry: scripts/hooks/deploy/trivy-config-full.sh
        language: script
        stages: [pre-push]
        always_run: true
        pass_filenames: false
        verbose: true

      - id: dashboard-test-full
        name: vitest (dashboard, full suite)
        entry: scripts/hooks/dashboard/dashboard-test-full.sh
        language: script
        stages: [pre-push]
        always_run: true
        pass_filenames: false

      - id: dashboard-contracts-current-all
        name: generated dashboard contracts are current (whole tree)
        entry: scripts/hooks/dashboard/dashboard-contracts-check.sh
        language: script
        stages: [pre-push]
        always_run: true
        pass_filenames: false
        require_serial: true

      - id: dashboard-integration-full
        name: vitest (dashboard, integration suite)
        entry: scripts/hooks/dashboard/dashboard-integration-full.sh
        language: script
        stages: [pre-push]
        always_run: true
        pass_filenames: false

      - id: dashboard-playwright-full
        name: playwright (dashboard, Chromium acceptance)
        entry: scripts/hooks/dashboard/dashboard-playwright-full.sh
        language: script
        stages: [pre-push]
        always_run: true
        pass_filenames: false

      - id: dashboard-typecheck-full
        name: tsc --noEmit (dashboard, whole project)
        entry: scripts/hooks/dashboard/dashboard-typecheck-full.sh
        language: script
        stages: [pre-push]
        always_run: true
        pass_filenames: false

      - id: dashboard-quality-full
        name: eslint and prettier (dashboard, whole tree)
        entry: scripts/hooks/dashboard/dashboard-quality-full.sh
        language: script
        stages: [pre-push]
        always_run: true
        pass_filenames: false

      - id: dashboard-build
        name: vite build (dashboard production build)
        entry: scripts/hooks/dashboard/dashboard-build.sh
        language: script
        stages: [pre-push]
        always_run: true
        pass_filenames: false

      - id: commit-messages-current
        name: commit messages (pushed range)
        entry: scripts/hooks/repo/check-commit-messages.sh
        language: script
        stages: [pre-push]
        always_run: true
        pass_filenames: false

      - id: diagrams-fresh-all
        name: diagrams regenerated (all)
        entry: scripts/hooks/docs/check-diagrams-all.sh
        language: script
        stages: [pre-push]
        always_run: true
        pass_filenames: false

  # --------------------------------------------- post-checkout / post-merge --
  - repo: local
    hooks:
      - id: sync-dependencies
        name: sync dependencies if lockfiles changed
        entry: scripts/hooks/deps/sync-deps.sh
        language: script
        stages: [post-checkout, post-merge]
        always_run: true
        pass_filenames: false

  # --------------------------------------------------------------- strict ---
  - repo: local
    hooks:
      # Blocking since 2026-08-19: the planning-document backlog is cleared and
      # this is green on the whole tree. The script skips docs/adr/* (immutable by
      # policy) and CONTRIBUTING.md (documents the very words it bans).
      - id: docs-strict
        name: docs (no unquantified terms)
        entry: scripts/hooks/check-docs-strict.sh
        language: script
        types: [markdown]
