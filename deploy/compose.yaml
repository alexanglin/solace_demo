# The single definition of the local runtime (docs/adr/0044). Every component except Ollama
# runs from this file, and the compose policy gate (docs/adr/0045) holds it to the policy on
# every commit. Run `just secrets` once, then use `just up` or `just mission-control-up`.
#
# Profiles:
#   default          broker, Postgres, and the Agent Mesh. `just up` provisions the broker
#                    authorization matrix before the mesh connects (docs/adr/0102).
#   services         application services outside the bounded mission-control acceptance stack
#   mission-control  the seven dashboard extension services; the supported recipe adds them to
#                    this same project only after its shared broker and Postgres are healthy
#   event-portal     the non-gating Event Management Agent (docs/adr/0043)
name: aerial-rescue-mesh

x-trust-store: &trust-store ./certs:/etc/aerial-rescue/certs:ro

x-broker-environment: &broker-environment
  SOLACE_BROKER_URL: ${SOLACE_BROKER_URL}
  SOLACE_BROKER_VPN: ${SOLACE_BROKER_VPN}
  TRUST_STORE: ${TRUST_STORE}

x-store-environment: &store-environment
  POSTGRES_USER: ${POSTGRES_USER}
  POSTGRES_DB: ${POSTGRES_DB}
  POSTGRES_PASSWORD_FILE: /run/secrets/postgres-password

x-application: &application
  build:
    context: ..
    dockerfile: deploy/application/Dockerfile
  image: aerial-rescue/application:0.0.0
  profiles: ["services"]
  user: "10001:10001"
  read_only: true
  tmpfs:
    - /tmp:size=16m,mode=1777
  restart: "no"
  security_opt:
    - no-new-privileges:true

services:
  broker:
    image: solace/solace-pubsub-standard:10.26.0.8799@sha256:05f80ec7bd38c7592bebfb88a729b1b61c99fc1553758663f13eac626624698f
    hostname: broker
    shm_size: 1g
    ulimits:
      core: -1
      nofile:
        soft: 2448
        hard: 1048576
    environment:
      username_admin_globalaccesslevel: admin
      username_admin_passwordfilepath: /run/secrets/broker-admin-password
      tls_servercertificate_filepath: /run/secrets/broker-server.pem
      system_scaling_maxconnectioncount: "100"
    secrets:
      - broker-admin-password
      - source: broker-server-pem
        target: broker-server.pem
    ports:
      - "127.0.0.1:55443:55443"
      - "127.0.0.1:1943:1943"
    volumes:
      - broker-storage:/var/lib/solace
    networks:
      - event-mesh
      - broker-loopback
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:5550/health-check/direct-active >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 90s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  postgres:
    image: postgres:18.6-trixie@sha256:4ef4dbc939d61acea57712655ddb4b4ab27419c913f94cca0cd57cb3ea3c2280
    environment:
      <<: *store-environment
    secrets:
      - postgres-password
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    networks:
      - store
      - postgres-loopback
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  agent-mesh:
    build:
      context: ./agent-mesh
      dockerfile: Dockerfile
    image: aerial-rescue/agent-mesh:1.28.7
    environment:
      SOLACE_DEV_MODE: "false"
      SOLACE_BROKER_URL: ${SOLACE_BROKER_URL}
      SOLACE_BROKER_USERNAME: ${SOLACE_AGENT_MESH_AGENT_USERNAME}
      SOLACE_BROKER_PASSWORD: ${SOLACE_AGENT_MESH_AGENT_PASSWORD}
      SOLACE_AGENT_MESH_AGENT_USERNAME: ${SOLACE_AGENT_MESH_AGENT_USERNAME}
      SOLACE_AGENT_MESH_AGENT_PASSWORD: ${SOLACE_AGENT_MESH_AGENT_PASSWORD}
      SOLACE_EVENT_MESH_GATEWAY_USERNAME: ${SOLACE_EVENT_MESH_GATEWAY_USERNAME}
      SOLACE_EVENT_MESH_GATEWAY_PASSWORD: ${SOLACE_EVENT_MESH_GATEWAY_PASSWORD}
      SOLACE_EVENT_MESH_TOOL_USERNAME: ${SOLACE_EVENT_MESH_TOOL_USERNAME}
      SOLACE_EVENT_MESH_TOOL_PASSWORD: ${SOLACE_EVENT_MESH_TOOL_PASSWORD}
      SOLACE_BROKER_VPN: ${SOLACE_BROKER_VPN}
      TRUST_STORE: ${TRUST_STORE}
      USE_TEMPORARY_QUEUES: ${USE_TEMPORARY_QUEUES}
      NAMESPACE: ${NAMESPACE}
      SESSION_SECRET_KEY: ${SESSION_SECRET_KEY}
      FASTAPI_HOST: 0.0.0.0
      FASTAPI_PORT: "8000"
      LLM_SERVICE_ENDPOINT: ${LLM_SERVICE_ENDPOINT}
      LLM_SERVICE_GENERAL_MODEL_NAME: ${LLM_SERVICE_GENERAL_MODEL_NAME}
      LLM_SERVICE_API_KEY: ${LLM_SERVICE_API_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OLLAMA_HOST: ${OLLAMA_HOST}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ../agent-mesh/configs:/app/configs:ro
      - *trust-store
    ports:
      - "127.0.0.1:8000:8000"
    networks:
      - event-mesh
      - model-egress
    depends_on:
      broker:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/opt/venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/readyz', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  migration:
    <<: *application
    profiles: ["services", "mission-control"]
    command: ["/app/.venv/bin/python", "-m", "aerial_rescue_store.migrate"]
    environment:
      <<: *store-environment
    secrets:
      - postgres-password
    networks:
      - store
    depends_on:
      postgres:
        condition: service_healthy

  fleet-simulator:
    <<: *application
    profiles: ["services", "mission-control"]
    command: ["/app/.venv/bin/python", "-m", "aerial_rescue_fleet_simulator"]
    environment:
      <<: *broker-environment
      SOLACE_BROKER_PASSWORD_FILE: /run/secrets/fleet-broker-password
      FLEET_CONTROL_SECRET_FILE: /run/secrets/fleet-control-secret
      FLEET_COMMAND_INTAKE_MODE: ${AERIAL_RESCUE_FLEET_COMMAND_INTAKE_MODE:-enabled}
    secrets:
      - fleet-broker-password
      - fleet-control-secret
    volumes:
      - *trust-store
    networks:
      - event-mesh
      - scenario-fleet
    depends_on:
      broker:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/app/.venv/bin/python", "-c", "import socket; connection=socket.create_connection(('127.0.0.1',8082),3); connection.close()"]
      interval: 5s
      timeout: 4s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  scenario-service:
    <<: *application
    profiles: ["services", "mission-control"]
    command: ["/app/.venv/bin/python", "-m", "aerial_rescue_scenario_service"]
    environment:
      <<: *broker-environment
      SOLACE_BROKER_PASSWORD_FILE: /run/secrets/scenario-broker-password
      SCENARIO_CONTROL_SECRET_FILE: /run/secrets/scenario-control-secret
      FLEET_CONTROL_SECRET_FILE: /run/secrets/fleet-control-secret
      SCENARIO_ROOT: /app/scenarios
    secrets:
      - scenario-broker-password
      - scenario-control-secret
      - fleet-control-secret
    volumes:
      - *trust-store
      - ../scenarios:/app/scenarios:ro
    networks:
      - event-mesh
      - scenario-fleet
      - dashboard-scenario
    depends_on:
      broker:
        condition: service_healthy
      fleet-simulator:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/app/.venv/bin/python", "-c", "import socket; connection=socket.create_connection(('127.0.0.1',8081),3); connection.close()"]
      interval: 5s
      timeout: 4s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  recorder:
    <<: *application
    profiles: ["services", "mission-control"]
    command: ["/app/.venv/bin/python", "-m", "aerial_rescue_recorder"]
    environment:
      <<: [*broker-environment, *store-environment]
      SOLACE_BROKER_PASSWORD_FILE: /run/secrets/recorder-broker-password
      RECORDER_READINESS_PATH: /run/aerial-rescue/recorder-readiness/ready.json
    secrets:
      - postgres-password
      - recorder-broker-password
    volumes:
      - *trust-store
      - recorder-readiness:/run/aerial-rescue/recorder-readiness
    networks:
      - event-mesh
      - store
    depends_on:
      broker:
        condition: service_healthy
      postgres:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/app/.venv/bin/python", "-m", "aerial_rescue_recorder.readiness", "--check", "/run/aerial-rescue/recorder-readiness/ready.json"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s
    restart: unless-stopped

  replay-validator:
    <<: *application
    profiles: ["services", "mission-control"]
    command:
      - /app/.venv/bin/python
      - -m
      - aerial_rescue_recorder.validator
      - --input
      - /input/v1/wilderness-missing-person.r1.ndjson
      - --output-directory
      - /run/aerial-rescue/replay-output
    network_mode: none
    volumes:
      - ../recordings:/input:ro
      - validated-replay:/run/aerial-rescue/replay-output

  dashboard-api:
    <<: *application
    profiles: ["services", "mission-control"]
    command: ["/bin/sh", "-c", "umask 0007; exec /app/.venv/bin/python -m aerial_rescue_dashboard_api"]
    environment:
      <<: *store-environment
      DASHBOARD_ASSET_ROOT: /app/dashboard
      DASHBOARD_SOCKET: /run/aerial-rescue/dashboard-api.sock
      SCENARIO_CONTROL_URL: http://scenario-service:8081
      SCENARIO_CONTROL_SECRET_FILE: /run/secrets/scenario-control-secret
      RECORDER_READINESS_PATH: /run/aerial-rescue/recorder-readiness/ready.json
    secrets:
      - postgres-password
      - scenario-control-secret
    volumes:
      - dashboard-socket:/run/aerial-rescue
      - validated-replay:/run/aerial-rescue/replay:ro
      - recorder-readiness:/run/aerial-rescue/recorder-readiness:ro
    networks:
      - store
      - dashboard-scenario
    depends_on:
      postgres:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
      scenario-service:
        condition: service_healthy
      recorder:
        condition: service_healthy
      replay-validator:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/app/.venv/bin/python", "-c", "import socket; connection=socket.socket(socket.AF_UNIX); connection.settimeout(3); connection.connect('/run/aerial-rescue/dashboard-api.sock'); connection.sendall(b'GET /api/v1/health HTTP/1.1\\r\\nHost: 127.0.0.1:8080\\r\\nConnection: close\\r\\n\\r\\n'); response=connection.recv(64); connection.close(); assert b' 200 ' in response"]
      interval: 5s
      timeout: 4s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  caddy:
    image: caddy:2.11.4-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
    profiles: ["mission-control"]
    user: "10001:10001"
    command: ["caddy", "run", "--config", "/etc/caddy/Caddyfile", "--adapter", "caddyfile"]
    environment:
      XDG_CONFIG_HOME: /tmp/config
      XDG_DATA_HOME: /tmp/data
    read_only: true
    tmpfs:
      - /tmp:size=16m,uid=10001,gid=10001,mode=0700
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - dashboard-socket:/run/aerial-rescue
    ports:
      - "127.0.0.1:8080:8080"
    networks:
      - caddy-loopback
    depends_on:
      dashboard-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:8080/api/v1/health"]
      interval: 5s
      timeout: 4s
      retries: 12
      start_period: 5s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  command-gateway:
    <<: *application
    command: ["/app/.venv/bin/python", "-c", "import aerial_rescue_command_gateway"]
    environment:
      <<: [*broker-environment, *store-environment]
      SOLACE_BROKER_USERNAME: ${SOLACE_COMMAND_GATEWAY_USERNAME}
      SOLACE_BROKER_PASSWORD: ${SOLACE_COMMAND_GATEWAY_PASSWORD}
    secrets:
      - postgres-password
    volumes:
      - *trust-store
    networks:
      - event-mesh
      - store
    depends_on:
      broker:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/app/.venv/bin/python", "-c", "import aerial_rescue_command_gateway"]
      interval: 30s
      timeout: 5s
      retries: 3

  evidence-service:
    <<: *application
    command: ["/app/.venv/bin/python", "-c", "import aerial_rescue_evidence_service"]
    environment:
      <<: [*broker-environment, *store-environment]
      SOLACE_BROKER_USERNAME: ${SOLACE_EVIDENCE_SERVICE_USERNAME}
      SOLACE_BROKER_PASSWORD: ${SOLACE_EVIDENCE_SERVICE_PASSWORD}
      OLLAMA_HOST: ${OLLAMA_HOST}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    secrets:
      - postgres-password
    volumes:
      - *trust-store
    networks:
      - event-mesh
      - store
      - model-egress
    depends_on:
      broker:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/app/.venv/bin/python", "-c", "import aerial_rescue_evidence_service"]
      interval: 30s
      timeout: 5s
      retries: 3

  event-management-agent:
    image: solace/event-management-agent:1.9.9@sha256:c5f3d9bf711dd051c14b162f10ecdbd7f3f7a85306d16c438c92229719123c5b
    platform: linux/amd64
    profiles: ["event-portal"]
    environment:
      SOLACE_SEMP_USERNAME: ${SOLACE_SEMP_USERNAME}
      SOLACE_SEMP_PASSWORD: ${SOLACE_SEMP_PASSWORD}
      SOLACE_VPN_NAME: ${SOLACE_VPN_NAME}
    secrets:
      - source: ema-connection-file
        target: /config/ema.yml
    ports:
      - "127.0.0.1:8180:8180"
    networks:
      - event-mesh
      - model-egress
    depends_on:
      broker:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 8180"]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 60s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

secrets:
  broker-admin-password:
    file: ./secrets/broker-admin-password
  broker-server-pem:
    file: ./secrets/broker-server.pem
  postgres-password:
    file: ./secrets/postgres-password
  fleet-broker-password:
    file: ./secrets/broker-fleet-simulator-password
  scenario-broker-password:
    file: ./secrets/broker-scenario-service-password
  recorder-broker-password:
    file: ./secrets/broker-recorder-password
  fleet-control-secret:
    file: ./secrets/fleet-control-secret
  scenario-control-secret:
    file: ./secrets/scenario-control-secret
  ema-connection-file:
    file: ./secrets/ema-connection-file.yml

networks:
  event-mesh:
    internal: true
  broker-loopback:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.enable_ip_masquerade: "false"
      com.docker.network.bridge.host_binding_ipv4: "127.0.0.1"
  store:
    internal: true
  postgres-loopback:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.enable_ip_masquerade: "false"
      com.docker.network.bridge.host_binding_ipv4: "127.0.0.1"
  dashboard-scenario:
    internal: true
  scenario-fleet:
    internal: true
  caddy-loopback:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.enable_ip_masquerade: "false"
      com.docker.network.bridge.host_binding_ipv4: "127.0.0.1"
  model-egress: {}

volumes:
  broker-storage: {}
  postgres-data: {}
  dashboard-socket:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: size=1m,uid=10001,gid=10001,mode=0770
  validated-replay: {}
  recorder-readiness:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: size=64k,uid=10001,gid=10001,mode=0750
