networks:
  event-mesh:
    internal: true
  broker-loopback:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.enable_ip_masquerade: "false"
      com.docker.network.bridge.host_binding_ipv4: "127.0.0.1"
  store:
    internal: true
  postgres-loopback:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.enable_ip_masquerade: "false"
      com.docker.network.bridge.host_binding_ipv4: "127.0.0.1"
  dashboard-scenario:
    internal: true
  scenario-fleet:
    internal: true
  caddy-loopback:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.enable_ip_masquerade: "false"
      com.docker.network.bridge.host_binding_ipv4: "127.0.0.1"
  model-egress: {}

volumes:
  broker-storage: {}
  postgres-data: {}
  dashboard-socket:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: size=1m,uid=10001,gid=10001,mode=0770
  validated-replay: {}
  recorder-readiness:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: size=64k,uid=10001,gid=10001,mode=0750
