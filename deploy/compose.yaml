# The single definition of the local runtime (docs/adr/0044). Every component except Ollama
# runs from this file, and the compose policy gate (docs/adr/0045) holds it to the policy on
# every commit. Run `just secrets` once, then `just up`.
#
# Profiles:
#   default       broker, postgres, and the Agent Mesh from its derived official image. The
#                 mesh joined the default profile when agent-mesh/configs/ landed, which is
#                 the condition docs/adr/0044 set and docs/adr/0102 executes. `just up` is
#                 the supported entry point: it provisions the authorization matrix before
#                 the mesh connects, and a bare `docker compose up` does not.
#   services      the application services; each command imports its package and exits,
#                 because no entrypoint exists yet; documented, not live behaviour
#   event-portal  the Event Management Agent for Event Portal runtime discovery; an amd64
#                 image run under emulation; never gating (docs/adr/0043)
name: aerial-rescue-mesh

x-trust-store: &trust-store ./certs:/etc/aerial-rescue/certs:ro

# Everything a service needs that is not its broker identity. Identity is per service,
# because docs/adr/0061 gives each component its own least-privilege client username; a
# service that shares one shares its authority (docs/security/threat-model.md T3).
x-application-environment: &application-environment
  SOLACE_BROKER_URL: ${SOLACE_BROKER_URL}
  SOLACE_BROKER_VPN: ${SOLACE_BROKER_VPN}
  TRUST_STORE: ${TRUST_STORE}
  OLLAMA_HOST: ${OLLAMA_HOST}
  POSTGRES_USER: ${POSTGRES_USER}
  POSTGRES_DB: ${POSTGRES_DB}
  POSTGRES_PASSWORD_FILE: /run/secrets/postgres-password

x-application: &application
  build:
    context: ..
    dockerfile: deploy/application/Dockerfile
  image: aerial-rescue/application:0.0.0
  profiles: ["services"]
  environment:
    <<: *application-environment
  secrets:
    - postgres-password
  volumes:
    - *trust-store
  extra_hosts:
    - "host.docker.internal:host-gateway"
  depends_on:
    broker:
      condition: service_healthy
    postgres:
      condition: service_healthy
  # Replaced by a real readiness probe when the service gains an entrypoint.
  healthcheck:
    test: ["CMD", "/app/.venv/bin/python", "-c", "import aerial_rescue_contracts"]
    interval: 30s
    timeout: 5s
    retries: 3
  restart: "no"
  security_opt:
    - no-new-privileges:true

services:
  broker:
    image: solace/solace-pubsub-standard:10.26.0.8799@sha256:05f80ec7bd38c7592bebfb88a729b1b61c99fc1553758663f13eac626624698f
    hostname: broker
    # Solace's single-node template fixes the shared memory, the file limits, and the
    # 100-connection scaling tier; the admin password and the server certificate are
    # compose secrets written by `just secrets` (docs/adr/0046).
    shm_size: 1g
    ulimits:
      core: -1
      nofile:
        soft: 2448
        hard: 1048576
    environment:
      username_admin_globalaccesslevel: admin
      username_admin_passwordfilepath: /run/secrets/broker-admin-password
      tls_servercertificate_filepath: /run/secrets/broker-server.pem
      system_scaling_maxconnectioncount: "100"
    secrets:
      - broker-admin-password
      - source: broker-server-pem
        target: broker-server.pem
    # SMF over TLS and SEMP over TLS only; 8080, 8000, 55555, and every other default stay
    # unpublished, which is how the reserved-port collisions are removed (docs/adr/0044).
    ports:
      - "127.0.0.1:55443:55443"
      - "127.0.0.1:1943:1943"
    volumes:
      - broker-storage:/var/lib/solace
    healthcheck:
      # /health-check/direct-active is the standalone endpoint. Whether the image carries
      # curl is confirmed by the first live run; the documented fallback is a /dev/tcp probe.
      test: ["CMD-SHELL", "curl -fsS http://localhost:5550/health-check/direct-active >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 90s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  postgres:
    image: postgres:18.6-trixie@sha256:1957b2ff3137e4ef7f3bc813e74fff50b1e1ffddc85c8b9d6f14ade972be8687
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres-password
    secrets:
      - postgres-password
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      # PostgreSQL 18 moved the data directory: PGDATA is /var/lib/postgresql/18/docker and
      # the image declares /var/lib/postgresql as its volume. Mounting the 17-era
      # /var/lib/postgresql/data would leave the cluster outside the named volume, and it is
      # also the layout that makes `pg_upgrade --link` fail on a mount-point boundary at the
      # next major (docs/adr/0060).
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  agent-mesh:
    build:
      context: ./agent-mesh
      dockerfile: Dockerfile
    image: aerial-rescue/agent-mesh:1.28.7
    environment:
      # The image defaults developer mode on, binds the Web UI to every interface inside
      # the container, and ships a placeholder session secret; each is overridden here.
      # Loopback-only is enforced by the host binding below, not inside the container.
      SOLACE_DEV_MODE: "false"
      SOLACE_BROKER_URL: ${SOLACE_BROKER_URL}
      # The runtime's own identity. The Event Mesh Gateway and Tool are separate roles with
      # separate credentials, named by their own configuration under agent-mesh/configs/
      # (docs/adr/0061, docs/adr/0032).
      #
      # Both spellings are passed. The generic pair is what the image's own defaults read; the
      # role-named pair is what agent-mesh/configs/ references, because a configuration that
      # names the role it runs as can be reviewed against the authorization matrix, while
      # `SOLACE_BROKER_USERNAME` cannot. Without the role-named pair inside the container the
      # reference expands to empty and the broker refuses the connection as the shutdown
      # factory `default` username, retrying forever without an error (docs/adr/0061).
      SOLACE_BROKER_USERNAME: ${SOLACE_AGENT_MESH_AGENT_USERNAME}
      SOLACE_BROKER_PASSWORD: ${SOLACE_AGENT_MESH_AGENT_PASSWORD}
      SOLACE_AGENT_MESH_AGENT_USERNAME: ${SOLACE_AGENT_MESH_AGENT_USERNAME}
      SOLACE_AGENT_MESH_AGENT_PASSWORD: ${SOLACE_AGENT_MESH_AGENT_PASSWORD}
      # The Event Mesh Gateway runs in this same connector process but is a separate role,
      # so it connects on its own identity on both the control plane and the data plane
      # (agent-mesh/configs/event-mesh-gateway.yaml, docs/adr/0061). A gate test holds this
      # list to every credential the mounted configuration names, because the validator
      # checks those references against the host-scope .env.example and cannot see in here.
      SOLACE_EVENT_MESH_GATEWAY_USERNAME: ${SOLACE_EVENT_MESH_GATEWAY_USERNAME}
      SOLACE_EVENT_MESH_GATEWAY_PASSWORD: ${SOLACE_EVENT_MESH_GATEWAY_PASSWORD}
      # The Event Mesh Tool runs inside the MissionCoordinator app but opens its own
      # request/reply session on its own identity, which may publish the gateway-request
      # family and consume only the reserved reply channel (docs/adr/0070).
      SOLACE_EVENT_MESH_TOOL_USERNAME: ${SOLACE_EVENT_MESH_TOOL_USERNAME}
      SOLACE_EVENT_MESH_TOOL_PASSWORD: ${SOLACE_EVENT_MESH_TOOL_PASSWORD}
      SOLACE_BROKER_VPN: ${SOLACE_BROKER_VPN}
      TRUST_STORE: ${TRUST_STORE}
      USE_TEMPORARY_QUEUES: ${USE_TEMPORARY_QUEUES}
      NAMESPACE: ${NAMESPACE}
      SESSION_SECRET_KEY: ${SESSION_SECRET_KEY}
      FASTAPI_HOST: 0.0.0.0
      FASTAPI_PORT: "8000"
      LLM_SERVICE_ENDPOINT: ${LLM_SERVICE_ENDPOINT}
      LLM_SERVICE_GENERAL_MODEL_NAME: ${LLM_SERVICE_GENERAL_MODEL_NAME}
      LLM_SERVICE_API_KEY: ${LLM_SERVICE_API_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OLLAMA_HOST: ${OLLAMA_HOST}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ../agent-mesh/configs:/app/configs:ro
      - *trust-store
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      broker:
        condition: service_healthy
    healthcheck:
      # The management server's readiness probe; the first configuration enables it.
      test: ["CMD", "/opt/venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/readyz', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  dashboard-api:
    <<: *application
    command: ["/app/.venv/bin/python", "-c", "import aerial_rescue_dashboard_api"]
    environment:
      <<: *application-environment
      SOLACE_BROKER_USERNAME: ${SOLACE_DASHBOARD_API_USERNAME}
      SOLACE_BROKER_PASSWORD: ${SOLACE_DASHBOARD_API_PASSWORD}
    ports:
      - "127.0.0.1:8080:8080"

  fleet-simulator:
    <<: *application
    command: ["/app/.venv/bin/python", "-c", "import aerial_rescue_fleet_simulator"]
    environment:
      <<: *application-environment
      SOLACE_BROKER_USERNAME: ${SOLACE_FLEET_SIMULATOR_USERNAME}
      SOLACE_BROKER_PASSWORD: ${SOLACE_FLEET_SIMULATOR_PASSWORD}

  command-gateway:
    <<: *application
    command: ["/app/.venv/bin/python", "-c", "import aerial_rescue_command_gateway"]
    environment:
      <<: *application-environment
      SOLACE_BROKER_USERNAME: ${SOLACE_COMMAND_GATEWAY_USERNAME}
      SOLACE_BROKER_PASSWORD: ${SOLACE_COMMAND_GATEWAY_PASSWORD}

  scenario-service:
    <<: *application
    command: ["/app/.venv/bin/python", "-c", "import aerial_rescue_scenario_service"]
    environment:
      <<: *application-environment
      SOLACE_BROKER_USERNAME: ${SOLACE_SCENARIO_SERVICE_USERNAME}
      SOLACE_BROKER_PASSWORD: ${SOLACE_SCENARIO_SERVICE_PASSWORD}

  evidence-service:
    <<: *application
    command: ["/app/.venv/bin/python", "-c", "import aerial_rescue_evidence_service"]
    environment:
      <<: *application-environment
      SOLACE_BROKER_USERNAME: ${SOLACE_EVIDENCE_SERVICE_USERNAME}
      SOLACE_BROKER_PASSWORD: ${SOLACE_EVIDENCE_SERVICE_PASSWORD}

  recorder:
    <<: *application
    command: ["/app/.venv/bin/python", "-c", "import aerial_rescue_recorder"]
    environment:
      <<: *application-environment
      SOLACE_BROKER_USERNAME: ${SOLACE_RECORDER_USERNAME}
      SOLACE_BROKER_PASSWORD: ${SOLACE_RECORDER_PASSWORD}

  event-management-agent:
    image: solace/event-management-agent:1.9.9@sha256:c5f3d9bf711dd051c14b162f10ecdbd7f3f7a85306d16c438c92229719123c5b
    # Published for amd64 only; Docker Desktop runs it under emulation (docs/adr/0044).
    platform: linux/amd64
    profiles: ["event-portal"]
    environment:
      # The names the agent's connection file reads. The connection file itself is
      # generated in the Solace Cloud console and kept as an ignored secret.
      SOLACE_SEMP_USERNAME: ${SOLACE_SEMP_USERNAME}
      SOLACE_SEMP_PASSWORD: ${SOLACE_SEMP_PASSWORD}
      SOLACE_VPN_NAME: ${SOLACE_VPN_NAME}
    secrets:
      - source: ema-connection-file
        target: /config/ema.yml
    ports:
      - "127.0.0.1:8180:8180"
    depends_on:
      broker:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 8180"]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 60s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

secrets:
  broker-admin-password:
    file: ./secrets/broker-admin-password
  broker-server-pem:
    file: ./secrets/broker-server.pem
  postgres-password:
    file: ./secrets/postgres-password
  ema-connection-file:
    file: ./secrets/ema-connection-file.yml

volumes:
  broker-storage: {}
  postgres-data: {}
