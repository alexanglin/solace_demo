# Workspace root for the Aerial Rescue Mesh application side.
#
# This project also owns the repository tooling package `tools/`, which is kept as a
# flat top-level package so `python -m tools.aaa_checker.gate` keeps working from the
# repository root -- the pre-commit `test-aaa` hook invokes it that way in an isolated
# environment that does not install this project.
#
# `agent-mesh/` is deliberately NOT a workspace member: a uv workspace shares one
# resolution and one interpreter constraint, which the 3.13/3.14 split forbids
# (docs/adr/0004-split-python-runtimes.md, docs/adr/0010-uv-workspace-and-toolchain.md).
[project]
name = "aerial-rescue-mesh"
version = "0.0.0"
description = "Repository tooling and workspace root for Aerial Rescue Mesh."
requires-python = ">=3.14,<3.15"
dependencies = []

# The exact developer and CI interpreter is pinned in .python-version and ADR-0004;
# the package range allows compatible 3.14 patch releases for built distributions.

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tools"]

[tool.aerial-rescue]
# Risk tier per docs/adr/0017-mutation-tool-score-and-risk-tiers.md. A member with no
# declared tier fails the gate rather than defaulting to the weakest one.
risk-tier = 2

[tool.uv.workspace]
members = ["packages/*", "services/*"]

[tool.uv]
required-version = "==0.12.5"
# Resolve for the development host and the container target, per ADR-0010: images are
# built for linux/aarch64 while development happens on macOS arm64, so a lockfile
# resolved only for the host fails at image build time.
environments = [
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'linux' and platform_machine == 'aarch64'",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio>=1",
    "pytest-cov>=6",
    "hypothesis>=6",
    # Pinned to match the pre-commit hook versions so `scripts/fix.sh` and the hooks
    # cannot drift apart (.pre-commit-config.yaml).
    "mypy==2.3.1",
    "ruff==0.16.3",
    "tree-sitter==0.26.0",
    "tree-sitter-typescript==0.23.2",
    "bandit==1.9.4",
    "pip-audit==2.10.1",
    "pre-commit==4.6.2",
    "coverage>=7",
    "jsonschema==4.26.0",
    "referencing==0.37.0",
    "types-jsonschema==4.26.0.20260518",
    # The compose policy gate parses deploy/ with PyYAML, which was already locked
    # transitively through pre-commit; declaring it is what makes the import deliberate,
    # and the stubs are what let strict mypy check it with no override
    # (docs/adr/0045-fail-closed-compose-policy-gate.md).
    "pyyaml==6.0.3",
    "types-pyyaml==6.0.12.20260815",
    "complexipy==7.0.1",
    "mutmut==3.7.0",
]

[tool.complexipy]
max-complexity-allowed = 15
check-script = true
no-ignore = true

[tool.uv.sources]
aerial-rescue-domain = { workspace = true }
aerial-rescue-contracts = { workspace = true }
aerial-rescue-broker = { workspace = true }
aerial-rescue-observability = { workspace = true }
aerial-rescue-store = { workspace = true }

# --------------------------------------------------------------------------- ruff ---
# Carries the complexity ceilings docs/adr/0011 requires "set at their intended values
# from the first commit". Before this config existed ruff ran its default rule set
# (E4, E7, E9, F), so C901 and the PLR09xx family were silently inactive even though
# .pre-commit-config.yaml claimed otherwise.
[tool.ruff]
target-version = "py314"
line-length = 100
extend-exclude = [".venv", "agent-mesh/.venv"]

[tool.ruff.lint]
select = [
    "E", "W",      # pycodestyle
    "F",           # pyflakes
    "I",           # isort
    "UP",          # pyupgrade
    "B",           # bugbear
    "C90",         # mccabe -- C901 complexity
    "PL",          # pylint, including the PLR09xx ceilings
    "RUF",
    "ANN",         # annotations; ADR-0011 forbids untyped code
    "S",           # fast Bandit-compatible diagnostics
    "PGH",         # blanket type/noqa suppression diagnostics
    "TID",         # tidy-imports, the layering mechanism
    "PT",          # pytest style
    "SIM", "RET", "ARG", "PTH", "ERA", "TRY", "EM", "N", "D",
]
ignore = [
    "D203",  # conflicts with D211; ADR-0025 records the Google-style choice
    "D213",  # conflicts with D212; ADR-0025 records the Google-style choice
    # This repository writes tests as unittest.TestCase subclasses, which the AAA gate
    # in tools/aaa_checker explicitly supports. ADR-0025 records why PT009 would fight
    # that established convention.
    "PT009",
]

[tool.ruff.lint.mccabe]
max-complexity = 8

[tool.ruff.lint.pylint]
max-args = 5
max-branches = 10
max-returns = 6
max-statements = 30
max-locals = 12
max-nested-blocks = 3
max-bool-expr = 4

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Test modules may assert (S101) and need no public docstrings. Matched by filename as
# well as directory, because not every suite lives under a directory called "tests".
"tests/**" = ["S101", "D100", "D101", "D102", "D103", "ANN201"]
"**/tests/**" = ["S101", "D100", "D101", "D102", "D103", "ANN201"]
"**/test_*.py" = ["S101", "D100", "D101", "D102", "D103", "ANN201"]
"**/*_tests/**" = ["S101", "D100", "D101", "D102", "D103", "ANN201"]

# ADR-0025 permits S603 only for these reviewed subprocess owners. Every executable is
# absolute before launch; there is no S607 waiver anywhere in the repository.
"tools/aaa_checker/checker.py" = ["S603"]
"tools/coverage_gate.py" = ["S603"]
"tools/quality_gate_tests/support.py" = ["S603"]
"tools/quality_gate_tests/test_diagram_integrity.py" = ["S603"]

# -------------------------------------------------------------------------- mypy ---
[tool.mypy]
python_version = "3.14"
strict = true
# Workspace member tests intentionally reuse behavior-focused basenames. Map every
# namespace-package path from the repository root so mypy does not collapse those
# independent modules into one top-level name.
explicit_package_bases = true
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
warn_unreachable = true
# None of the four below is implied by `strict`, which in mypy 1.19 expands to fifteen
# flags and stops there. Measured on 2026-08-20: all thirteen optional error codes plus
# these three switches cost zero errors on this tree, so they are a ratchet rather than a
# migration (docs/adr/0056-raise-mypy-to-every-lever-the-tree-satisfies.md). They are
# declared here, not on a hook command line, because the commit-stage hooks read only this
# table -- a command-line setting would make the fast stage weaker than the authoritative
# one, which is the disagreement ADR-0029 exists to prevent.
disallow_any_explicit = true
strict_equality_for_none = true
local_partial_types = true
enable_error_code = [
    "deprecated",
    "exhaustive-match",
    "explicit-override",
    "ignore-without-code",
    "mutable-override",
    "possibly-undefined",
    "redundant-expr",
    "redundant-self",
    "truthy-bool",
    "truthy-iterable",
    "unimported-reveal",
    "unused-awaitable",
    "unused-ignore",
]
# agent-mesh/ runs on 3.13 and is checked by its own invocation. Without this,
# scripts/hooks/mypy-full.sh's `mypy .` type-checks it a second time under the wrong
# interpreter, contradicting the routing invariant CONTRIBUTING.md describes.
# `mutants/` holds mutmut's generated copy of a tier-one member, including a second
# copy of its package, which mypy reports as a duplicate module. It is gitignored
# execution evidence rather than owned source (CONTRIBUTING.md), and Ruff already
# skips it because Ruff honours .gitignore while mypy does not. Without this, every
# type check after the first mutation run fails.
exclude = ["^agent-mesh/", "^\\.venv/", "/mutants/"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# The Solace PubSub+ client ships no py.typed marker and no stub package exists, so
# strict mypy reports import-untyped for every import of it. ADR-0011 forbids a blanket
# inline suppression, and there is no `# type: ignore` anywhere in this tree, so the
# relaxation is declared here instead: narrow to this distribution, and removable the day
# upstream ships a marker (docs/adr/0028-untyped-solace-client-boundary.md). Everything
# the client returns is Any, which is why it must stay behind a typed adapter rather than
# being called from domain code.
[[tool.mypy.overrides]]
module = ["solace.*", "solace_otel.*"]
ignore_missing_imports = true

# ------------------------------------------------------------------------ pytest ---
[tool.pytest.ini_options]
minversion = "8.0"
# Without testpaths, the bare `pytest` in scripts/hooks/pytest-full.sh collects
# agent-mesh/ under the wrong interpreter and trips on duplicate module basenames.
testpaths = ["tests", "tools", "packages", "services"]
# Same reason as the mypy exclusion above: mutmut copies each tier-one member's
# tests into `mutants/`, and collecting that copy runs every member test twice.
# Setting this REPLACES pytest's defaults rather than extending them, so the whole
# default list is restated; dropping ".*" alone makes pytest descend into
# .hypothesis and .venv.
norecursedirs = [
    "*.egg",
    ".*",
    "_darcs",
    "build",
    "CVS",
    "dist",
    "node_modules",
    "venv",
    "{arch}",
    "mutants",
]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--import-mode=importlib",
    "-ra",
]
xfail_strict = true
filterwarnings = [
    "error",
    # The pinned Solace client's own docstrings carry invalid escape sequences, which
    # Python 3.14 reports as a compile-time SyntaxWarning. Escalating it turns importing
    # the client into a SyntaxError, and because the warning fires only when CPython
    # compiles the source, the failure appears on a cold bytecode cache and vanishes on a
    # warm one. Ruff W605 catches this same defect in owned source at lint time, so
    # silencing the runtime warning costs no coverage of our own code
    # (docs/adr/0028-untyped-solace-client-boundary.md).
    "ignore:.*invalid escape sequence.*:SyntaxWarning",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    # Test classes, named to match docs/TESTING.md so the document and the selectors
    # are the same strings.
    "unit: pure domain rules, state machines, validation, reducers",
    "property: Hypothesis property-based invariants",
    "contract: cross-language schema, topic, CloudEvents, OpenAPI, golden fixtures",
    "integration: broker or provider integration against a running dependency",
    "e2e: mission start through evidence, replan, approval, completion",
    "uat: Playwright operator workflow and safety gates",
    "evaluation: curated agent-capability datasets",
    "failure_injection: broker loss, model loss, duplicates, malformed input, recovery",
    "performance: fleet telemetry rate, latency, backlog recovery, soak",
    "security: authorization-negative, schema fuzzing, prompt injection",
    "compatibility: black-box tests against the exact pinned wheels",
    "replay: committed fixture reproduces the same ordered outcome",
    "phase0: a Phase 0 feasibility gate probe",
    # Resource markers. CI asserts no broker or model credentials are configured, so
    # anything carrying one of these is excluded from the blocking suite.
    "broker: needs a reachable Solace broker",
    "ollama: needs a local Ollama daemon with pinned models",
    "paid: spends from a model-provider budget tranche",
    "docker: needs a running Docker daemon",
    "net: needs outbound network access",
]

# ---------------------------------------------------------------------- coverage ---
[tool.coverage.run]
branch = true
parallel = true
relative_files = true
omit = ["tools/**/tests/*", "tools/quality_gate_tests/*"]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "@overload"]

# -------------------------------------------------------------------------- bandit ---
[tool.bandit]
exclude_dirs = [".venv", "agent-mesh", "tests"]
