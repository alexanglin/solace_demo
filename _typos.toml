# Spellcheck. typos is identifier-aware and low-false-positive, which suits a
# prose-heavy repository full of product names and technical jargon.
[files]
extend-exclude = [
  "*.lock",
  "uv.lock",
  "pnpm-lock.yaml",
  "node_modules/",
  ".venv/",
  "agent-mesh/.venv/",
  "*.png",
  "fixtures/golden/",
]

[default]
# A W3C trace parent is 32 and 16 hexadecimal digits, and typos tokenizes runs of
# them into words: `00f067aa0ba902b7` yields a `ba` it reports as a typo of "by".
# Scoped to the trace-parent shape rather than to hexadecimal generally, so a real
# typo in ordinary prose still fails.
extend-ignore-re = ["00-[0-9a-f]{32}-[0-9a-f]{16}-[0-9a-f]{2}"]

[default.extend-words]
# Domain and product vocabulary that is not a typo.
Solace = "Solace"
PubSub = "PubSub"
pubsub = "pubsub"
CloudEvents = "CloudEvents"
cloudevents = "cloudevents"
Ollama = "Ollama"
ollama = "ollama"
qwen = "qwen"
Pydantic = "Pydantic"
asyncpg = "asyncpg"
SAR = "SAR"
sam = "sam"
nd = "nd"
# "PNGs" tokenizes to PN + Gs, and typos reports the PN token as a typo of
# "ON". The key must be the offending token, not the full word.
PN = "PN"
